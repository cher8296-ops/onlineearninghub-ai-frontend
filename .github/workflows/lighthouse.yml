name: Lighthouse Core Web Vitals

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for deployed site
        run: |
          for i in {1..24}; do
            if curl --fail --silent --show-error https://www.flowchera21.bg5.net/ -o /dev/null; then
              echo "Website is responding."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not respond within the wait period." >&2
          exit 1
      - name: Run Lighthouse CI against production
        run: npx --yes @lhci/cli@0.15.0 autorun --config=.lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-core-web-vitals-report
          path: .lighthouseci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
