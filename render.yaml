services:
  - type: web
    name: onlineearninghub-ai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://onlineearninghub-ai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
