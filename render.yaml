services:
  - type: web
    name: onlineearninghub-ai-frontend
    runtime: static
    buildCommand: npm install --no-audit && npm audit --omit=dev --audit-level=high && npm run build
    staticPublishPath: ./dist
    domains:
      - www.flowchera21.bg5.net
    envVars:
      - key: VITE_API_BASE_URL
        value: https://onlineearninghub-ai.onrender.com
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://onlineearninghub-ai.onrender.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
